<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#222222" />
    <title>Olanzi · 设备工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23e8c4b8'/%3E%3Ccircle cx='24' cy='24' r='11' fill='none' stroke='%23363434' stroke-width='7'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <span class="eyebrow">OLANZI WORKSPACE</span>
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <div class="dialog-actions">
          <button value="cancel" class="button secondary">取消</button
          ><button value="confirm" class="button primary">继续</button>
        </div>
      </form>
    </dialog>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
    />
  </body>
</html>
